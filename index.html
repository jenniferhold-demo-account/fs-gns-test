    <title>SaaSly Dashboard2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chartist/0.11.4/chartist.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartist/0.11.4/chartist.min.js"></script>
    <style>
        /* Force the charts to have height even if the library struggles */
        .ct-chart { height: 250px; width: 100%; }
        .ct-series-a .ct-line { stroke: #3b82f6; stroke-width: 3px; }
        .ct-series-a .ct-point { stroke: #3b82f6; }
        .ct-series-a .ct-bar { stroke: #3b82f6; stroke-width: 20px; }
    </style>
</head>
<body class="bg-gray-50 flex h-screen">

    <div class="w-64 bg-slate-900 text-white hidden md:flex flex-col">
        <div class="p-6 text-2xl font-bold border-b border-slate-800">SaaSly</div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="index.html" class="block py-2.5 px-4 rounded bg-blue-600">Dashboard</a>
            <a href="analytics.html" class="block py-2.5 px-4 rounded hover:bg-slate-800 transition">Analytics</a>
            <a href="customers.html" class="block py-2.5 px-4 rounded hover:bg-slate-800 transition">Customers</a>
        </nav>
    </div>

    <main class="flex-1 overflow-y-auto p-6">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="font-bold text-gray-800 mb-4">Revenue Growth</h3>
                <div id="chart1" class="ct-chart"></div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="font-bold text-gray-800 mb-4">User Activity</h3>
                <div id="chart2" class="ct-chart"></div>
            </div>
        </div>
    </main>

    <script>
        window.onload = function() {
            // Line Chart
            new Chartist.Line('#chart1', {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'],
                series: [[12, 19, 15, 22, 24]]
            });

            // Bar Chart
            new Chartist.Bar('#chart2', {
                labels: ['W1', 'W2', 'W3', 'W4'],
                series: [[5, 2, 4, 8]]
            });
            
            console.log("Chartist initialized!");
        };
    </script>
