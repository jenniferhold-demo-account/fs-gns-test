<body class="bg-gray-50 flex h-screen">
    <div class="w-64 bg-slate-900 text-white hidden md:flex flex-col">
        <div class="p-6 text-2xl font-bold border-b border-slate-800">SaaSly</div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="index.html" class="block py-2.5 px-4 rounded bg-blue-600">Dashboard</a>
            <a href="analytics.html" class="block py-2.5 px-4 rounded hover:bg-slate-800 transition text-slate-300">Analytics</a>
            <a href="customers.html" class="block py-2.5 px-4 rounded hover:bg-slate-800 transition text-slate-300">Customers</a>
        </nav>
    </div>

    <main class="flex-1 overflow-y-auto p-6">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="font-bold text-gray-800 mb-4">Revenue Growth</h3>
                <div id="chart-revenue"></div> </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="font-bold text-gray-800 mb-4">User Split</h3>
                <div id="chart-users"></div>
            </div>
        </div>
    </main>

  <script>
    // This ensures the code only runs AFTER the page and library are fully loaded
    window.onload = function() {
        try {
            const revData = {
                labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun"],
                datasets: [{ values: [12000, 19000, 15000, 22000, 24000, 24500] }]
            };

            new frappe.Chart("#chart-revenue", {
                data: revData,
                type: 'line', 
                height: 250,
                colors: ['#3b82f6']
            });

            new frappe.Chart("#chart-users", {
                data: {
                    labels: ["Free", "Pro", "Enterprise"],
                    datasets: [{ values: [500, 600, 184] }]
                },
                type: 'percentage',
                height: 250,
                colors: ['#e2e8f0', '#3b82f6', '#0f172a']
            });
            
            console.log("Charts initialized successfully!");
        } catch (error) {
            console.error("Chart failed to load:", error);
        }
    };
</script>
</body>
</html>
