    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - SaaSly</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex h-screen">
    <div class="w-64 bg-slate-900 text-white hidden md:flex flex-col">
        <div class="p-6 text-2xl font-bold border-b border-slate-800">SaaSly</div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="index.html" class="block py-2.5 px-4 rounded hover:bg-slate-800 transition text-slate-300">Dashboard</a>
            <a href="analytics.html" class="block py-2.5 px-4 rounded hover:bg-slate-800 transition text-slate-300">Analytics</a>
            <a href="customers.html" class="block py-2.5 px-4 rounded bg-blue-600">Customers</a>
        </nav>
    </div>

    <main class="flex-1 overflow-y-auto p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">User Management</h2>
        
        <div class="flex space-x-2 mb-6">
            <button onclick="filterTable('all')" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm">All</button>
            <button onclick="filterTable('Pro')" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm hover:bg-gray-50">Pro Only</button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left" id="userTable">
                <thead>
                    <tr class="bg-gray-50 text-xs text-gray-500 uppercase">
                        <th class="p-4">Customer</th>
                        <th class="p-4">Plan</th>
                        <th class="p-4">Status</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <tr class="user-row" data-plan="Enterprise">
                        <td class="p-4 font-medium">Alex Rivera</td>
                        <td class="p-4 text-sm text-gray-600">Enterprise</td>
                        <td class="p-4"><span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs">Active</span></td>
                    </tr>
                    <tr class="user-row" data-plan="Pro">
                        <td class="p-4 font-medium">Sarah Jenkins</td>
                        <td class="p-4 text-sm text-gray-600">Pro</td>
                        <td class="p-4"><span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs">Active</span></td>
                    </tr>
                    <tr class="user-row" data-plan="Free">
                        <td class="p-4 font-medium">Liam Neeson</td>
                        <td class="p-4 text-sm text-gray-600">Free</td>
                        <td class="p-4"><span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs">Churned</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        function filterTable(plan) {
            const rows = document.querySelectorAll('.user-row');
            rows.forEach(row => {
                if (plan === 'all' || row.getAttribute('data-plan') === plan) {
                    row.style.display = 'table-row';
                } else {
                    row.style.display = 'none';
                }
            });
        }
    </script>
